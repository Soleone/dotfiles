"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](gold_shadow)\
$directory\
${custom.git_clean}\
${custom.git_dirty}\
${custom.no_git}\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:raised)"""

palette = 'gilt'

# Git is rendered as custom mutually-exclusive full segments so the branch,
# status area, and both powerline dividers all share the same color.
# Clean repo: jade text. Dirty repo: copper text. No repo: direct path -> tools divider.
[custom.git_clean]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git status --porcelain)"'
command = '''
branch=$(git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null)
printf " %s " "$branch"
'''
format = '[](fg:gold_shadow bg:jade)[ $output ](fg:obsidian bg:jade)[](fg:jade bg:raised)'

[custom.git_dirty]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n "$(git status --porcelain)"'
command = '''
branch=$(git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null)
status=$(git status --porcelain 2>/dev/null)
marks=""
printf "%s" "$status" | grep -qE "(^| )M" && marks="${marks}*"
printf "%s" "$status" | grep -qE "^\?\?" && marks="${marks}*"
printf "%s" "$status" | grep -qE "(^| )D" && marks="${marks}✘"
printf "%s" "$status" | grep -qE "^R" && marks="${marks}»"
git rev-parse --verify refs/stash >/dev/null 2>&1 && marks="${marks}≡"
printf " %s %s " "$branch" "$marks"
'''
format = '[](fg:gold_shadow bg:oxblood)[ $output](fg:obsidian bg:oxblood)[](fg:oxblood bg:raised)'

[custom.no_git]
when = '! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = 'printf ""'
format = '[](fg:gold_shadow bg:raised)'

# Copied from omarchy-gilt-theme/apps/starship/gilt-palette.toml, plus gilt's
# bright_jade, bright_oxblood and bright_lapis (bright_blue) from colors.toml
[palettes.gilt]
obsidian = "#0D0F12"
raised = "#181B20"
parchment = "#D8D1C0"
ivory = "#F5EBD2"
taupe = "#918977"
dusty = "#716957"
gold = "#D4AF37"
bright_gold = "#E7C968"
gold_shadow = "#342D1B"
oxblood = "#BC6060"
bright_oxblood = "#D47474"
copper = "#C27B48"
jade = "#7FA37A"
bright_jade = "#9DBB8E"
verdigris = "#72A5A4"
lapis = "#6F8FAF"
bright_lapis = "#8FAECC"
amethyst = "#9A7AA0"
bronze = "#8A6240"
error = "#D47474"
warning = "#E7C968"
success = "#9DBB8E"

[username]
disabled = true
show_always = true
style_user = "bg:bright_oxblood fg:obsidian"
style_root = "bg:bright_oxblood fg:obsidian"
format = '[ $user ]($style)'

[directory]
style = "fg:gold bg:gold_shadow"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:jade"
format = '[[ $symbol $branch ](fg:obsidian bg:jade)]($style)'

[git_status]
style = "bg:oxblood"
format = '[[$all_status$ahead_behind ](fg:obsidian bg:oxblood)]($style)'
modified = "*"
untracked = "*"
deleted = "✘"
renamed = "»"
stashed = "≡"

[nodejs]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[c]
symbol = " "
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[cpp]
symbol = " "
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[rust]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[golang]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[php]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[java]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[kotlin]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[haskell]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[python]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $version) ](fg:bright_lapis bg:raised)]($style)'

[docker_context]
symbol = ""
style = "bg:raised"
format = '[[ $symbol( $context) ](fg:bright_lapis bg:raised)]($style)'

[conda]
style = "bg:raised"
format = '[[ $symbol( $environment) ](fg:bright_lapis bg:raised)]($style)'

[pixi]
style = "bg:raised"
format = '[[ $symbol( $version)( $environment) ](fg:parchment bg:raised)]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:raised"
format = '[[  $time ](fg:parchment bg:raised)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:success)'
error_symbol = '[](bold fg:error)'
vimcmd_symbol = '[](bold fg:success)'
vimcmd_replace_one_symbol = '[](bold fg:amethyst)'
vimcmd_replace_symbol = '[](bold fg:amethyst)'
vimcmd_visual_symbol = '[](bold fg:gold)'
