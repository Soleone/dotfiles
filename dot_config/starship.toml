"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_yellow)\
$directory\
${custom.git_clean}\
${custom.git_dirty}\
${custom.no_git}\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue)"""

palette = 'gruvbox_dark'

# Git is rendered as custom mutually-exclusive full segments so the branch,
# status area, and both powerline dividers all share the same color.
# Clean repo: aqua. Dirty repo: orange. No repo: direct path -> tools divider.
[custom.git_clean]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git status --porcelain)"'
command = '''
branch=$(git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null)
printf " %s " "$branch"
'''
format = '[](fg:color_yellow bg:color_aqua)[ $output ](fg:color_fg0 bg:color_aqua)[](fg:color_aqua bg:color_blue)'

[custom.git_dirty]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n "$(git status --porcelain)"'
command = '''
branch=$(git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null)
status=$(git status --porcelain 2>/dev/null)
marks=""
printf "%s" "$status" | grep -qE "(^| )M" && marks="${marks}*"
printf "%s" "$status" | grep -qE "^\?\?" && marks="${marks}*"
printf "%s" "$status" | grep -qE "(^| )D" && marks="${marks}✘"
printf "%s" "$status" | grep -qE "^R" && marks="${marks}»"
git rev-parse --verify refs/stash >/dev/null 2>&1 && marks="${marks}≡"
printf " %s %s " "$branch" "$marks"
'''
format = '[](fg:color_yellow bg:color_orange)[ $output](fg:color_fg0 bg:color_orange)[](fg:color_orange bg:color_blue)'

[custom.no_git]
when = '! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = 'printf ""'
format = '[](fg:color_yellow bg:color_blue)'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[username]
disabled = true
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_orange"
format = '[[$all_status$ahead_behind ](fg:color_fg0 bg:color_orange)]($style)'
modified = "*"
untracked = "*"
deleted = "✘"
renamed = "»"
stashed = "≡"

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
